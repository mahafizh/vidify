services:
  app:
    volumes:
      - ./data:/app/data
      - media:/media:ro
    environment:
      LIBRARY_ROOT: /media${SMB_SUBPATH:-}

volumes:
  media:
    driver: local
    driver_opts:
      type: cifs
      device: ${SMB_SHARE:?SMB_SHARE belum diisi di .env}
      o: username=${SMB_USER:?SMB_USER belum diisi di .env},password=${SMB_PASSWORD:?SMB_PASSWORD belum diisi di .env},vers=${SMB_VERSION:-3.0},ro
